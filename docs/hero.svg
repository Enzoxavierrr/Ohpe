<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dce0e6"/>
      <stop offset="1" stop-color="#f4f6fa"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4c7e"/>
      <stop offset="1" stop-color="#567ebb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t   { font-family: 'IBM Plex Sans', system-ui, sans-serif; fill: #1f1f20; }
      .tt  { font-family: 'Sora', 'IBM Plex Sans', sans-serif; font-weight: 300; }
      .ct  { font-size: 13px; }
      .ch  { font-size: 14px; }
      .cnt { font-size: 11px; font-weight: 600; fill: #2b4c7e; }
    </style>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>

  <!-- Brand -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="42" height="42" rx="11" fill="url(#mark)"/>
    <text x="21" y="28" text-anchor="middle" font-size="18" fill="#fff" class="tt">◇</text>
    <text x="58" y="28" class="t tt" font-size="26">Ohpe</text>
    <text x="58" y="52" class="t" font-size="12" fill="#606d80">Kanban minimalista · React + TS</text>
  </g>

  <!-- Download icon -->
  <g transform="translate(820, 44)" stroke="#2b4c7e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="20" fill="#fff" stroke="rgba(31,31,32,0.08)" stroke-width="1"/>
    <path d="M25 21v4a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-4"/>
    <polyline points="11 14 16 19 21 14"/>
    <line x1="16" y1="19" x2="16" y2="7"/>
  </g>

  <!-- Column: A fazer -->
  <g transform="translate(48, 110)" filter="url(#shadow)">
    <rect width="240" height="180" rx="18" fill="#ffffff" opacity="0.9" stroke="rgba(31,31,32,0.08)"/>
    <text x="16" y="30" class="t tt ch">A fazer</text>
    <rect x="82" y="16" width="34" height="18" rx="9" fill="#dce0e6"/>
    <text x="99" y="29" text-anchor="middle" class="cnt">3</text>

    <g transform="translate(16, 48)">
      <rect width="208" height="34" rx="10" fill="#fff" stroke="rgba(31,31,32,0.08)"/>
      <text x="14" y="22" class="t ct">Diagramar arquitetura</text>
    </g>
    <g transform="translate(16, 88)">
      <rect width="208" height="34" rx="10" fill="#fff" stroke="#567ebb"/>
      <text x="14" y="22" class="t ct">Escrever documentação</text>
    </g>
    <g transform="translate(16, 128)">
      <rect width="208" height="34" rx="10" fill="#fff" stroke="rgba(31,31,32,0.08)"/>
      <text x="14" y="22" class="t ct">Publicar release v0.1</text>
    </g>
  </g>

  <!-- Column: Em progresso -->
  <g transform="translate(308, 110)" filter="url(#shadow)">
    <rect width="240" height="180" rx="18" fill="#ffffff" opacity="0.9" stroke="rgba(31,31,32,0.08)"/>
    <text x="16" y="30" class="t tt ch">Em progresso</text>
    <rect x="122" y="16" width="34" height="18" rx="9" fill="#dce0e6"/>
    <text x="139" y="29" text-anchor="middle" class="cnt">1</text>

    <g transform="translate(16, 48)">
      <rect width="208" height="52" rx="10" fill="#fff" stroke="rgba(31,31,32,0.08)"/>
      <text x="14" y="22" class="t ct">Ajustar drag &amp; drop</text>
      <text x="14" y="40" class="t ct" fill="#606d80" font-size="11">com @dnd-kit e sortable</text>
    </g>
  </g>

  <!-- Column: Feito -->
  <g transform="translate(568, 110)" filter="url(#shadow)">
    <rect width="240" height="180" rx="18" fill="#ffffff" opacity="0.9" stroke="rgba(31,31,32,0.08)"/>
    <text x="16" y="30" class="t tt ch">Feito</text>
    <rect x="52" y="16" width="34" height="18" rx="9" fill="#dce0e6"/>
    <text x="69" y="29" text-anchor="middle" class="cnt">2</text>

    <g transform="translate(16, 48)">
      <rect width="208" height="34" rx="10" fill="#fff" stroke="rgba(31,31,32,0.08)"/>
      <text x="14" y="22" class="t ct">Setup Vite + TS</text>
    </g>
    <g transform="translate(16, 88)">
      <rect width="208" height="34" rx="10" fill="#fff" stroke="rgba(31,31,32,0.08)"/>
      <text x="14" y="22" class="t ct">Paleta e tipografia</text>
    </g>
  </g>
</svg>
